<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Load facts with a custom web component">
    <title>Useless Facts</title>
    <link rel="icon" href="images/user-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>

        <h1>Useless Facts</h1>

        <p>
